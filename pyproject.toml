[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-pilot"
version = "0.1.0"
description = "A feasibility pilot for historical marginal Uniswap v3 LP episodes"
requires-python = ">=3.11"
dependencies = ["pyarrow>=17,<24", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
figures = ["matplotlib>=3.10,<4"]

[project.scripts]
lp-pilot = "lp_pilot.__main__:main"

[tool.setuptools.packages.find]
include = ["lp_pilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
